__THEME_HEAD__
<style>
  /* colours: every mode and theme, generated by dexio/themes.py */
  __THEME_CSS__
  :root { --tap:40px;
          /* headings and page titles, as Wikipedia sets them. Libertinus is
             the wordmark's face and the fork of Wikipedia's Linux Libertine;
             most machines have neither, so Georgia is what usually shows. */
          --serif: "Libertinus Serif", "Linux Libertine", "Linux Libertine O",
                   Georgia, Times, serif; }

  * { box-sizing: border-box; }
  /* The graph view is one screen: the header, then the graph filling the rest.
     Every part that can be long (the page panel, the folder tree) scrolls on
     its own, so the page itself never does, also when embedded in a frame. */
  html, body { height: 100%; overflow: hidden; }
  /* Behind the header, the canvas and the body are the chrome's colour; the
     page's own background starts at #wrap. Whatever shows through above the
     header then matches it: Chrome can leave a 1px gap above a sticky element,
     and a trackpad bounce pulls the page down off the canvas. Both drew a thin
     white line over a coloured theme (Forrest, 2026-09-26). No vertical bounce
     either: the page never scrolls, so there is nothing to bounce. */
  html { background: var(--chrome); overscroll-behavior-y: none; }
  /* A column: the header takes what it needs, the graph gets the rest. The
     header's height varies (it wraps on phones), so no fixed offsets. */
  body {
    display: flex; flex-direction: column; height: 100dvh;
    margin: 0; color: var(--text); background: var(--chrome);
    overscroll-behavior-y: none;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ---- header ----
     The header is the theme's chrome, like Slack's sidebar: plain in the
     default theme, coloured in the others. Inside it, --accent is the node
     colour that reads on the chrome.
     Three columns: the logo and the wiki picker, the search box, the counts
     and settings. Each side keeps the room its content needs, the search box
     takes up to 480px of what is left, and the sides split the rest evenly,
     so the box sits in the middle of the page, as Slack's does. When one
     side needs more than half, the box moves over rather than covering it.
     Below the width where all three fit, search takes its own row (see the
     narrow-screen rules). The exported file (render.offline, the dexio.wiki
     demo) is laid out differently: see "the exported file" below. */
  header {
    display: grid; align-items: center; column-gap: 16px;
    grid-template-columns: minmax(max-content, 1fr) minmax(200px, 480px) minmax(max-content, 1fr);
    padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--chrome-line); position: sticky; top: 0;
    /* above the guided flows (#onboard, 6), so the header's menus open over them */
    background: var(--chrome); color: var(--chrome-text); z-index: 7;
    flex: none;
    --accent: var(--chrome-accent);
  }
  header .h-start, header .h-end { display: flex; align-items: center; gap: 10px; }
  header .h-end { justify-content: flex-end; }
  header .brand { display: flex; align-items: center; gap: 6px; flex: none;
                  color: var(--chrome-text); text-decoration: none; margin-right: 4px; }
  header .brand svg { display: block; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap;
              color: var(--chrome-muted); min-width: 0; overflow: hidden;
              text-overflow: ellipsis; }
  /* the exported file's wiki name, beside a centred search box */
  @media (min-width: 821px) { header h1 { max-width: 16vw; } }
  /* The exported file (render.offline, class="export"): one row, the logo and
     the wiki picker or name at the left and search at the right, down to
     640px; below that search takes its own row, full width. It was centred as in the
     app, with nothing on the right once the counts went (Forrest,
     2026-09-27: "the search bar should be right aligned"). */
  header.export { display: flex; flex-wrap: wrap; align-items: center; row-gap: 8px; column-gap: 16px; }
  header.export .h-start { flex: 1 1 auto; min-width: 0; }
  header.export .h-end { display: none; }
  header.export #find { flex: 0 1 320px; max-width: 320px; min-width: 200px; margin-left: auto; order: 0; }
  @media (max-width: 640px) {
    header.export #find { order: 10; flex: 1 1 100%; max-width: none; margin-left: 0; }
  }

  input, button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 9px;
  }
  input { min-height: 34px; }
  input:focus, button:focus-visible {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  header input, header button, header a.icon-btn {
    color: var(--chrome-text); background: var(--chrome-field);
    border-color: var(--chrome-field-line);
  }
  header input::placeholder { color: var(--chrome-muted); opacity: 1; }

  /* ---- search ----
     Centred in the header with a list of the matching pages under it, best
     first (Forrest, 2026-09-26, option D of four mockups; it was a 200px box
     in the far corner). The field's right end holds the key hint while it is
     empty and a clear button once there is text, level with the magnifier on
     the left. The browser's own clear button is hidden: it sat inside the
     room kept for the hint, out of line with everything else. The list is
     drawn in the page's colours, as the wiki picker's menu is. */
  #find { position: relative; justify-self: center; width: 100%; max-width: 480px; min-width: 0; }
  #find .find-icon {
    position: absolute; left: 11px; top: 50%; width: 15px; height: 15px; margin-top: -7.5px;
    fill: none; stroke: var(--chrome-muted); stroke-width: 2; stroke-linecap: round;
    pointer-events: none;
  }
  #search {
    display: block; width: 100%; height: 34px; padding: 0 38px 0 34px; border-radius: 8px;
    -webkit-appearance: none; appearance: none;
  }
  #search::-webkit-search-cancel-button,
  #search::-webkit-search-decoration { -webkit-appearance: none; display: none; }
  #find-keys {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    padding: 0 6px; border: 1px solid var(--chrome-field-line); border-radius: 5px;
    font-family: inherit; font-size: 11.5px; font-weight: 500; line-height: 18px;
    color: var(--chrome-muted); pointer-events: none; white-space: nowrap;
  }
  #find:focus-within #find-keys, #find.has-text #find-keys { display: none; }
  /* 28px square, its centre 18.5px from the right edge, as the magnifier's
     is from the left */
  header #find-clear {
    position: absolute; right: 4.5px; top: 50%; width: 28px; height: 28px; margin-top: -14px;
    display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px;
    background: transparent; color: var(--chrome-muted); cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  header #find-clear[hidden] { display: none; }
  header #find-clear:hover {
    color: var(--chrome-text); background: color-mix(in srgb, var(--chrome-text) 10%, transparent);
  }
  #find-clear svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
                    stroke-width: 2.2; stroke-linecap: round; }
  #find-list {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20;
    min-width: min(360px, calc(100vw - 24px));
    max-height: min(70dvh, 480px); overflow: auto; overscroll-behavior: contain;
    padding: 6px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--text); box-shadow: var(--shadow);
    font-size: 13.5px; --accent: var(--page-accent);
  }
  #find-list[hidden] { display: none; }
  .find-head { padding: 6px 10px 4px; color: var(--muted); font-size: 11.5px; font-weight: 600;
               letter-spacing: .06em; text-transform: uppercase; }
  .find-item {
    display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 6px 10px;
    border-radius: 6px; cursor: pointer;
  }
  .find-item.on { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  html[data-mode="dark"] .find-item.on { background: color-mix(in srgb, var(--accent) 24%, transparent); }
  .find-item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .find-folder { display: flex; flex: none; margin: 0 -3px; }
  .find-folder svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5;
                   stroke-linejoin: round; }
  .find-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .find-path { flex: none; max-width: 45%; margin-left: auto; padding-left: 12px; color: var(--muted);
               font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .find-enter { flex: none; width: 12px; color: var(--muted); font-size: 12px; visibility: hidden; }
  .find-item.on .find-enter { visibility: visible; }
  .find-more { padding: 6px 10px 2px; color: var(--muted); font-size: 12.5px; }
  .find-foot { margin: 4px 4px 0; padding: 7px 6px 3px; border-top: 1px solid var(--line);
               color: var(--muted); font-size: 12px; }
  /* touch: no keyboard to hint at */
  @media (hover: none) { #find-keys, .find-foot { display: none; } }

  /* Icon button: square, at least a 40px tap target on touch. */
  .icon-btn {
    display: inline-grid; place-items: center;
    width: 34px; height: 34px; padding: 0; cursor: pointer;
    color: var(--muted);
  }
  header .icon-btn, header a.icon-btn { color: var(--chrome-muted); }
  header .icon-btn:hover { color: var(--chrome-text); }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .icon-btn svg { width: 16px; height: 16px; fill: none;
                  stroke: currentColor; stroke-width: 1.9;
                  stroke-linecap: round; stroke-linejoin: round; }
  a.icon-btn { border: 1px solid var(--line-strong); border-radius: 6px;
               background: var(--panel); text-decoration: none; }

  /* ---- the workspace menu (the app) and the wiki picker (an exported file) ----
     A quiet button in the chrome with its own menu drawn in the page's colours,
     not the chrome's. The app shows the workspace menu alone, a workspace having
     one wiki (2026-09-28); the exported file's #switcher picks between the wikis
     it holds. The workspace menu's own styles are render.WS_MENU_CSS, shared with
     Settings. --page-accent keeps the page accent, which the header replaces with
     the chrome's for everything inside it. */
  :root { --page-accent: var(--accent); }
  #crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 0 1 auto; }
  #crumbs .sw-sep { flex: none; padding: 0 2px; color: var(--chrome-muted); opacity: .6; }
  header .wsm-button { color: var(--chrome-text);
                       transition: background .12s ease, border-color .12s ease; }
  header .wsm-button:hover, header .wsm-button[aria-expanded="true"] {
    background: var(--chrome-field); border-color: var(--chrome-field-line); }
  header .wsm-label { font-weight: 500; max-width: 200px; }
  header .wsm-menu { --accent: var(--page-accent); }
  #switcher { position: relative; min-width: 0; flex: 0 1 auto; }
  #switcher-button {
    display: flex; align-items: center; gap: 7px; min-width: 0; max-width: 100%;
    height: 34px; padding: 0 8px 0 10px; border: 1px solid transparent; border-radius: 7px;
    background: transparent; color: var(--chrome-text); cursor: pointer;
    font-size: 14px; white-space: nowrap;
    transition: background .12s ease, border-color .12s ease;
  }
  #switcher-button:hover, #switcher-button[aria-expanded="true"] {
    background: var(--chrome-field); border-color: var(--chrome-field-line);
  }
  #switcher-button .sw-wiki { font-weight: 600; overflow: hidden; text-overflow: ellipsis;
                              max-width: 260px; }
  /* beside a centred search box, long names give way before the box does */
  @media (min-width: 1141px) {
    header .wsm-label { max-width: min(200px, 11vw); }
    #switcher-button .sw-wiki { max-width: min(260px, 14vw); }
  }
  .sw-chev { flex: none; width: 14px; height: 14px; fill: none; stroke: var(--chrome-muted);
             stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #switcher-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
    min-width: 280px; max-width: min(360px, calc(100vw - 24px));
    max-height: min(70dvh, 520px); overflow: auto; overscroll-behavior: contain;
    padding: 6px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--text); box-shadow: var(--shadow);
    --accent: var(--page-accent);
  }
  #switcher-menu[hidden] { display: none; }
  .sw-head { padding: 8px 10px 4px; color: var(--muted); font-size: 11.5px; font-weight: 600;
             letter-spacing: .06em; text-transform: uppercase; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
  .sw-item {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px;
    padding: 6px 10px; border: 0; border-radius: 6px; background: none;
    color: var(--text); font: inherit; text-align: left; cursor: pointer;
  }
  .sw-item:hover, .sw-item:focus-visible { background: var(--sunken); outline: none;
                                           box-shadow: none; }
  html[data-mode="dark"] .sw-item:hover,
  html[data-mode="dark"] .sw-item:focus-visible { background: var(--line); }
  .sw-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sw-item[aria-checked="true"] .sw-name { font-weight: 600; }
  .sw-meta { margin-left: auto; padding-left: 12px; color: var(--muted); font-size: 12.5px;
             white-space: nowrap; }
  .sw-check { flex: none; width: 15px; height: 15px; fill: none; stroke: var(--accent);
              stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
              visibility: hidden; }
  .sw-item:not(:has(.sw-meta)) .sw-check { margin-left: auto; }
  .sw-item[aria-checked="true"] .sw-check { visibility: visible; }
  .sw-empty { padding: 6px 10px; color: var(--muted); }
  .sw-new { color: var(--muted); }
  .sw-new:hover, .sw-new:focus-visible { color: var(--text); }
  .sw-plus { flex: none; width: 15px; height: 15px; fill: none; stroke: currentColor;
             stroke-width: 1.8; stroke-linecap: round; }
  .sw-form { padding: 0 0 4px; }
  .sw-form .sw-head { display: block; }
  .sw-form-row { display: flex; gap: 6px; padding: 2px 6px 0; }
  #switcher-menu .sw-form input {
    flex: 1 1 auto; min-width: 0; color: var(--text); background: var(--field);
    border-color: var(--line-strong);
  }
  #switcher-menu .sw-form input::placeholder { color: var(--muted); }
  #switcher-menu .sw-create {
    flex: none; color: var(--btn-text); background: var(--btn); border-color: var(--btn);
    font-weight: 600; cursor: pointer;
  }
  #switcher-menu .sw-create:hover { background: var(--btn-hover); border-color: var(--btn-hover); }
  #switcher-menu .sw-create:disabled { opacity: .6; cursor: default; }
  .sw-hint { margin: 6px 10px 2px; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
  .sw-hint.sw-error { color: var(--bad-text); }
  .sw-rule { height: 1px; margin: 6px 4px; background: var(--line); }
  @media (max-width: 640px) {
    #switcher-button, header .wsm-button { height: var(--tap); }
    header .wsm-label { max-width: 28vw; }
    #switcher-button .sw-wiki { max-width: 34vw; }
    .sw-item { min-height: var(--tap); }
    /* 16px keeps iOS from zooming into the field */
    #switcher-menu .sw-form input { font-size: 16px; }
  }
  /* a phone keeps the menu on the brand's row: the workspace as its initial,
     an exported file's wiki by name */
  @media (max-width: 480px) {
    header .wsm-label { display: none; }
    #switcher-button .sw-wiki { max-width: 40vw; }
  }

  /* ---- guided flows: connect your AI (where the graph goes) ---- */
  #onboard {
    position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto;
    box-sizing: border-box; padding: 24px 26px 22px; font-size: 14px; line-height: 1.5;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); --accent: var(--page-accent);
  }
  /* an empty wiki has nothing to lay out or browse, so only the steps show */
  #wrap.onboarding footer, #wrap.onboarding #layout-pick,
  #wrap.onboarding #tree, #wrap.onboarding #tree-open { display: none; }
  #onboard h2 { font-size: 18px; margin: 0 0 6px; padding-right: 32px; }
  #onboard h3 { font-size: 15px; margin: 18px 0 4px; }
  #onboard p { margin: 6px 0 10px; }
  #onboard .ob-lead { color: var(--muted); margin: 0 0 16px; }
  #onboard .ob-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12.5px;
                       font-weight: 600; }
  #onboard .ob-row { display: flex; gap: 8px; }
  #onboard input {
    flex: 1 1 auto; min-width: 0; font: inherit; color: var(--text); background: var(--field);
    border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 10px;
  }
  #onboard input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  /* The app's buttons (the system is in server/login.py; Forrest, 2026-09-28, option A of
     four): a step's main action is 44px, Copy is 32px. */
  #onboard .cta, #onboard button.copy {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px;
    font: inherit; font-size: 15px; font-weight: 600; color: var(--btn-text);
    background: var(--btn); border: 1px solid transparent; border-radius: 8px;
    text-decoration: none; cursor: pointer;
    transition: background-color .12s ease, border-color .12s ease;
  }
  #onboard button.copy { min-height: 32px; padding: 0 12px; font-size: 13.5px; margin: 0 0 8px; }
  #onboard .cta:hover, #onboard button.copy:hover { background: var(--btn-hover); }
  #onboard .cta:active, #onboard button.copy:active { background: var(--btn-press); }
  #onboard .cta:focus-visible, #onboard button.copy:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-color: transparent; box-shadow: none;
  }
  #onboard .cta:disabled { opacity: .5; cursor: default; pointer-events: none; }
  #onboard .ob-hint { margin: 8px 0 0; color: var(--muted); font-size: 12.5px; }
  #onboard .ob-error { color: var(--bad-text); }
  #onboard a:not(.cta) { color: var(--accent); }
  /* the AI tiles (.ai-grid, .ai-tile) are ais.CSS, shared with Settings > Agents */
  #onboard ol.steps { padding-left: 20px; margin: 6px 0; }
  #onboard ol.steps li { margin: 4px 0 10px; }
  #onboard .muted { color: var(--muted); font-size: 13px; }
  #onboard pre {
    margin: 6px 0 8px; padding: 9px 11px; overflow-x: auto; white-space: pre;
    background: var(--sunken); border: 1px solid var(--line); border-radius: 6px;
    font-size: 12.5px; line-height: 1.45;
  }
  #onboard pre code.agent-prompt { white-space: pre-wrap; overflow-wrap: anywhere; }
  #onboard code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #onboard details { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
  #onboard summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  @media (max-width: 640px) {
    #onboard { top: 16px; transform: translateX(-50%); padding: 20px 18px; }
    /* 16px keeps iOS from zooming into the field */
    #onboard input { font-size: 16px; }
  }
  /* ---- graph ---- */
  /* The closed page panel waits just past the right edge (below it on phones).
     Unclipped, that made the whole page scroll sideways by the panel's width.
     clip rather than hidden: a hidden box can still be scrolled by focus or
     scrollIntoView, which would slide the graph over. */
  #wrap { position: relative; flex: 1 1 auto; min-height: 0; display: flex;
          background: var(--bg);
          overflow: hidden; overflow: clip; }
  #graph {
    flex: 1 1 auto; min-width: 0; height: 100%; display: block; cursor: grab;
    touch-action: none;           /* we handle pan and pinch ourselves */
  }
  #graph:active { cursor: grabbing; }

  /* ---- folder tree ----
     The wiki's folders and pages beside the graph, like a file explorer. Each
     page carries its node's colour, so the tree is also the graph's key.
     Like the page panel on the right, it slides in over the graph rather
     than taking width from it, so opening or closing it never resizes the
     graph (it did until 2026-09-26). It also carries its own hide button in
     a head row, as the panel carries its close button; the toggle used to
     sit in the header, left of the logo, away from what it controls
     (Forrest, 2026-09-26). Its right edge drags to resize it, like the
     panel's left edge; graph.js keeps the width in --tree-w on #wrap, so
     the controls that sit beside the tree follow it. */
  #tree {
    position: absolute; top: 0; left: 0; bottom: 0; width: var(--tree-w, 264px);
    max-width: calc(100vw - 160px);
    display: flex; flex-direction: column; background: var(--panel);
    border-right: 1px solid var(--line); font-size: 13px;
    transform: translateX(-100%);
    /* closed, it is out of the tab order and hidden from screen readers, as
       the panel is; visibility waits for the slide-out to finish */
    visibility: hidden; transition: transform .18s ease, visibility 0s linear .18s;
    box-shadow: none;
  }
  #wrap.tree-open #tree { transform: none; box-shadow: var(--shadow); visibility: visible;
                          transition: transform .18s ease; }
  #wrap.tree-open footer { left: calc(var(--tree-w, 264px) + 14px); }
  /* The resize grip rides on the tree's right edge, so it slides and hides
     with the tree. The same hairline as the panel's grip shows on hover. */
  #tree-grip {
    position: absolute; top: 0; bottom: 0; right: -5px; width: 10px;
    cursor: col-resize; touch-action: none;
  }
  #tree-grip::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px;
    background: var(--accent); opacity: 0; transition: opacity .12s ease;
  }
  #tree-grip:hover::after, #tree-grip:focus-visible::after,
  body.resizing-tree #tree-grip::after { opacity: .6; }
  #tree-grip:focus-visible { outline: none; }
  body.resizing-tree { cursor: col-resize; user-select: none; }
  body.resizing-tree #layout-pick { transition: none; }
  #tree .tree-head {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    height: 44px; padding: 0 6px 0 16px; color: var(--muted);
    font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  }
  /* only the list scrolls, so the head and its hide button stay put */
  #tree-list { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain;
               padding: 0 6px 28px; }
  /* quiet, like the page panel's close button */
  #tree-close {
    width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent;
    color: var(--muted); transition: background .12s ease, color .12s ease;
  }
  #tree-close:hover { background: var(--sunken); color: var(--text); }
  html[data-mode="dark"] #tree-close:hover { background: var(--line); }
  /* Closed, a small button over the graph's top-left corner brings it back.
     It vanishes at once when the tree opens and returns once it has slid away. */
  #tree-open {
    position: absolute; top: 12px; left: 12px; border-radius: 9px;
    border: 1px solid var(--line-strong); background: var(--panel);
    box-shadow: 0 2px 8px rgba(16, 22, 26, .10); transition: opacity .15s ease .1s;
  }
  /* ---- account menu, top right (server only; see render.py) ----
     The person's initials in a circle, opening a menu drawn like the
     switcher's: who is signed in, the workspace's settings, members and connect
     flow, their own profile and appearance, and sign out. */
  #acct { position: relative; flex: none; }
  #acct-button {
    display: grid; place-items: center; width: 34px; height: 34px; padding: 0;
    border: 1px solid transparent; border-radius: 50%; background: transparent; cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  #acct-button:hover, #acct-button[aria-expanded="true"] {
    background: var(--chrome-field); border-color: var(--chrome-field-line);
  }
  .avatar {
    display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px;
    border-radius: 50%; background: var(--btn); color: var(--btn-text);
    font-size: 11.5px; font-weight: 700; letter-spacing: .02em; line-height: 1;
    user-select: none;
  }
  /* on a coloured header the circle takes a ring so it never sinks into the bar */
  header .avatar { box-shadow: 0 0 0 1.5px var(--chrome-field-line); }
  #acct-menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 20;
    width: 272px; max-width: calc(100vw - 24px); padding: 6px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--text); box-shadow: var(--shadow);
    --accent: var(--page-accent);
  }
  #acct-menu[hidden] { display: none; }
  #acct-menu .avatar { box-shadow: none; width: 32px; height: 32px; font-size: 12.5px; }
  .ac-who { display: flex; align-items: center; gap: 10px; padding: 8px 10px 6px; }
  .ac-id { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
  .ac-id b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ac-id span { color: var(--muted); font-size: 12.5px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  #acct-menu form { margin: 0; }
  #acct-menu a.sw-item { text-decoration: none; }
  .ac-icon { flex: none; width: 16px; height: 16px; fill: none; stroke: var(--muted);
             stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ac-icon .fill { fill: var(--muted); stroke: none; }
  #acct-menu .sw-item:hover .ac-icon, #acct-menu .sw-item:focus-visible .ac-icon {
    stroke: var(--text); }
  #acct-menu .sw-item:hover .ac-icon .fill { fill: var(--text); }
  #switcher-menu a.sw-item { text-decoration: none; }
  @media (max-width: 640px) {
    #acct-button { width: var(--tap); height: var(--tap); }
    #acct-menu .sw-item { min-height: var(--tap); }
  }
  #wrap.tree-open #tree-open { opacity: 0; visibility: hidden; transition: none; }
  /* Layout menu: beside the folder button, the same quiet chip. With the
     tree open it moves to the tree's edge, as the footer hint does. It opens
     a menu like the wiki switcher's, drawn in the page's own colours: it was a
     native select, whose list the browser drew in its own colours, unreadable
     in the dark theme and plainer than the switcher (Forrest, 2026-09-26). The
     items reuse the switcher's .sw-item, .sw-head and .sw-check. */
  #layout-pick { position: absolute; top: 12px; left: 54px; transition: left .18s ease; }
  #layout-button {
    display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 8px 0 10px;
    border: 1px solid var(--line-strong); border-radius: 9px; background: var(--panel);
    box-shadow: 0 2px 8px rgba(16, 22, 26, .10); color: var(--text);
    font-size: 13px; white-space: nowrap; cursor: pointer;
  }
  #layout-button:hover, #layout-button[aria-expanded="true"] { border-color: var(--accent); }
  #layout-button .lo-cap { color: var(--muted); }
  #layout-button .lo-now { font-weight: 600; }
  #layout-button .lo-icon { color: var(--muted); }
  #layout-button .sw-chev { stroke: var(--muted); }
  .lo-icon { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor;
             stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .lo-icon .dot { fill: currentColor; stroke: none; }
  #layout-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: 270px;
    max-width: calc(100vw - 24px); padding: 6px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--panel); color: var(--text); box-shadow: var(--shadow);
  }
  #layout-menu[hidden] { display: none; }
  #layout-menu .sw-item { align-items: flex-start; padding: 8px 10px; }
  #layout-menu .lo-icon { margin-top: 1px; color: var(--muted); }
  #layout-menu .sw-item[aria-checked="true"] .lo-icon { color: var(--accent); }
  #layout-menu .lo-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  #layout-menu .lo-desc { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
  #layout-menu .sw-check { margin-left: auto; margin-top: 1px; }
  #wrap.tree-open #layout-pick { left: calc(var(--tree-w, 264px) + 12px); }
  #tree ul { list-style: none; margin: 0; padding: 0; }
  #tree ul ul { margin-left: 13px; padding-left: 4px; border-left: 1px solid var(--line); }
  #tree .row {
    display: flex; align-items: center; gap: 7px; width: 100%; min-height: 27px;
    padding: 3px 8px; margin: 0; border: 0; border-radius: 5px; background: none;
    color: var(--text); font: inherit; text-align: left; text-decoration: none;
    cursor: pointer;
  }
  #tree .row:hover { background: var(--sunken); }
  #tree .row:focus-visible { outline: none;
    box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
  #tree .row.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  #tree .dir { color: var(--muted); font-weight: 600; }
  #tree .chev { width: 10px; height: 10px; flex: none; fill: none; stroke: currentColor;
                stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
                transition: transform .12s ease; }
  #tree .dir[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  #tree .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #tree .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tree .count { margin-left: auto; padding-left: 6px; color: var(--faint);
                 font-size: 11.5px; font-weight: 400; }
  #tree .empty { color: var(--muted); margin: 8px; }

  /* ---- detail panel ----
     Was a fixed 420px, about 50 characters a line: too narrow to read a page
     in. Now about 80 characters on a laptop, and resizable from its left edge
     (graph.js stores the width in --panel-w). */
  #panel {
    position: absolute; top: 0; right: 0;
    --panel-pad: 24px; --panel-max: calc(100vw - 160px);
    /* --panel-w is the width without the contents column; see "contents".
       --panel-box is the whole width, which focus centres (see "focus") */
    --panel-box: calc(min(var(--panel-w, clamp(440px, calc(40vw + 80px), 680px)),
                          var(--panel-max) - var(--toc-hold, 0px)) + var(--toc-room, 0px));
    width: var(--panel-box);
    min-width: min(360px, 92vw); max-width: var(--panel-max);
    height: 100%; background: var(--panel); border-left: 1px solid var(--line);
    padding: 0 var(--panel-pad) var(--panel-pad); overflow: auto; overscroll-behavior: contain;
    transform: translateX(100%);
    /* above the footer hint, which otherwise printed across the page text;
       under the resize grip (2) and the phone drawer (4) */
    z-index: 1;
    /* closed, it is also out of the tab order and hidden from screen readers;
       visibility waits for the slide-out to finish */
    visibility: hidden; transition: transform .18s ease, visibility 0s linear .18s;
    box-shadow: none;
  }
  #panel.open { transform: none; box-shadow: var(--shadow); visibility: visible;
                transition: transform .18s ease; }
  #panel-grip {
    position: absolute; top: 0; bottom: 0; width: 10px; margin-left: -5px;
    cursor: col-resize; z-index: 2; display: none; touch-action: none;
  }
  #panel-grip::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px;
    background: var(--accent); opacity: 0; transition: opacity .12s ease;
  }
  #panel-grip:hover::after, body.resizing #panel-grip::after { opacity: .6; }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing #panel { transition: none; }
  /* The boundary between the contents column and the text, in the middle of
     the gap between them: dragging it moves only that boundary, so the panel's
     edges stay put (graph.js places it; Forrest, 2026-09-26). */
  #toc-grip {
    position: absolute; top: 0; bottom: 0; width: 12px; margin-left: -6px;
    cursor: col-resize; z-index: 2; display: none; touch-action: none;
  }
  #toc-grip::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 5px; width: 2px;
    background: var(--accent); opacity: 0; transition: opacity .12s ease;
  }
  #toc-grip:hover::after, #toc-grip:focus-visible::after,
  body.resizing-toc #toc-grip::after { opacity: .6; }
  #toc-grip:focus-visible { outline: none; }
  body.resizing-toc { cursor: col-resize; user-select: none; }
  /* Title, meta line and close button stay pinned while the page scrolls.
     The panel has no top padding so the head can sit flush at the top; a
     rule appears under it once content is scrolling beneath. */
  /* z-index 2: above anything the page body lifts to 1 */
  #panel .panel-head {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: flex-start; gap: 12px;
    margin: 0 -24px 14px; padding: 16px 16px 12px 24px;
    background: var(--panel); border-bottom: 1px solid transparent;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  #panel .panel-head.stuck {
    border-bottom-color: var(--line);
    box-shadow: 0 6px 12px -10px rgba(16, 22, 26, .35);
  }
  #panel .panel-title { flex: 1 1 auto; min-width: 0; padding-top: 3px; }
  /* The title is a size above the section headings under it, in the same
     serif, as a Wikipedia article's is. It was 17px sans. */
  #panel .panel-title h2 { font-family: var(--serif); font-size: 26px; font-weight: 400;
                           line-height: 1.25; margin: 0 0 4px; overflow-wrap: anywhere; }
  #panel .meta { color: var(--muted); font-size: 12.5px; }
  #panel .links { margin-bottom: 14px; font-size: 13px; }
  #panel .links a { color: var(--link); text-decoration: none; }
  #panel .links a:hover { text-decoration: underline; }
  /* Backlinks sit under the page, one per line, like a wiki's "what links here". */
  #panel .backlinks {
    margin: 26px 0 8px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 13.5px; line-height: 1.75;
  }
  #panel .backlinks b { display: block; color: var(--muted); font-size: 12px; font-weight: 600;
                        text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  #panel .backlinks a { display: block; }
  #panel pre {
    white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sunken);
    border: 1px solid var(--line); border-radius: 6px; padding: 12px;
    font-size: 12.5px; color: var(--text);
  }
  /* While a page's text is on its way (graph.js, LOADING): lines in the
     shape of a few paragraphs, spaced like the text that replaces them.
     They fade in only after 150ms, so a page that arrives quickly never
     flashes them, then pulse until it does. */
  #panel .page-loading { padding-top: 4px; animation: page-loading-in .2s ease .15s both; }
  #panel .page-loading .sk {
    display: block; height: 11px; margin: 0 0 13px; border-radius: 4px;
    background: var(--line); animation: page-loading-pulse 1.4s ease-in-out .35s infinite;
  }
  #panel .page-loading .sk-gap { display: block; height: 11px; }
  #panel .page-loading .sk-label {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);
    white-space: nowrap;
  }
  @keyframes page-loading-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes page-loading-pulse { 50% { opacity: .45; } }
  #panel .page-error { color: var(--muted); font-size: 14px; }
  #panel .page-retry {
    min-height: 0; margin-left: 6px; padding: 4px 10px; border: 1px solid var(--btn-line);
    border-radius: 8px; background: var(--panel); color: var(--text); font: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  #panel .page-retry:hover { background: var(--btn-fill-hover); border-color: var(--btn-line-hover); }
  #panel .page-retry:active { background: var(--btn-fill-press); }

  /* ---- what a page says about itself (graph.js, okf.py) ----
     The Open Knowledge Format's fields in its frontmatter (Forrest,
     2026-10-04): a draft or deprecated page says so at the start of the line
     under the title, a deprecated page also opens with a note, and sources no
     footnote cites are listed above "Linked from". */
  #panel .pg-status {
    display: inline-block; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font-size: 11.5px; font-weight: 600; line-height: 17px;
  }
  #panel .pg-deprecated { color: var(--bad-text);
                          border-color: color-mix(in srgb, var(--bad-text) 45%, transparent); }
  #panel .page-notice {
    margin: 0 0 14px; padding: 8px 12px; border: 1px solid var(--line);
    border-left: 3px solid var(--bad-text); border-radius: 6px; background: var(--sunken);
    font-size: 13.5px; line-height: 1.5;
  }
  #panel .page-sources .src { display: block; }

  /* ---- history (graph.js, "history") ----
     Under the meta line, when the page was last edited and created. The
     Page / History tabs are the pinned head's bottom row, its rule their
     baseline, so they stay in reach however far down a page is read.
     History opens on a summary and the agents who wrote the page, then the
     revisions on a rail, grouped by day, each led by its note. One revision
     shows the lines it changed, with the words that changed inside a line
     marked, or the page as it was. The when-line holds its height while the
     dates load, so the head does not grow under the reader. Redesigned
     2026-09-27 (Forrest). */
  #panel .meta-when { min-height: 1.45em; margin-top: 1px; }
  #panel .muted { color: var(--muted); }
  #panel .plus { color: var(--good-text); }
  #panel .minus { color: var(--bad-text); }
  /* The tabs wrap onto a row of their own; the title takes what the row
     beside the buttons leaves (a basis of 0, or its long meta line pushed
     the buttons onto rows of their own). The tab row draws its own rule, as
     wide as the text; once the page scrolls under the head, the head's rule
     and shadow take over across the panel. */
  #panel .panel-head.has-tabs { flex-wrap: wrap; row-gap: 0; padding-bottom: 0; margin-bottom: 22px; }
  #panel .panel-head.has-tabs .panel-title { flex: 1 1 0; }
  #panel .panel-tabs {
    flex: 1 1 100%; display: flex; gap: 22px; margin: 10px 8px 0 0;
    border-bottom: 1px solid var(--line);
  }
  #panel .panel-head.stuck .panel-tabs { border-bottom-color: transparent; }
  /* The underline is a bar of its own, square at both ends. It was the
     tab's bottom border, which the 6px radius every button has bent up at
     the corners (Forrest, 2026-09-27). */
  #panel .panel-tabs [role="tab"] {
    position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 0;
    margin-bottom: -1px; padding: 7px 1px 11px; border: 0; border-radius: 0;
    background: none; color: var(--muted); font: inherit; font-size: 13.5px; font-weight: 500;
    cursor: pointer; transition: color .12s ease;
  }
  #panel .panel-tabs [role="tab"]::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: transparent; transition: background-color .12s ease;
  }
  #panel .panel-tabs [role="tab"] svg {
    flex: none; width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4;
    stroke-linecap: round; stroke-linejoin: round;
  }
  #panel .panel-tabs [role="tab"]:hover { color: var(--text); }
  #panel .panel-tabs [role="tab"]:hover::after { background: var(--line-strong); }
  #panel .panel-tabs [role="tab"][aria-selected="true"] { color: var(--text); }
  #panel .panel-tabs [role="tab"][aria-selected="true"]::after { background: var(--accent); }
  #panel .tab-count {
    min-width: 18px; padding: 0 6px; border-radius: 999px; background: var(--sunken);
    border: 1px solid var(--line); color: var(--muted); font-size: 11px; font-weight: 600;
    line-height: 16px; text-align: center; font-variant-numeric: tabular-nums;
  }
  html[data-mode="dark"] #panel .tab-count { background: var(--line); border-color: var(--line-strong); }
  #panel .panel-tabs [role="tab"]:focus-visible, #panel .hist-list .rev:focus-visible,
  #panel .rev-bar button:focus-visible, #panel .rev-show button:focus-visible,
  #panel .hist-more:focus-visible {
    outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
    border-radius: 6px;
  }

  /* an agent's initial, on a tint of its own hue (graph.js, avatar) */
  #panel .av {
    flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px;
    border-radius: 50%; font-size: 11px; font-weight: 700; line-height: 1;
    background: hsl(var(--av-h, 210) 62% 92%); color: hsl(var(--av-h, 210) 48% 30%);
  }
  html[data-mode="dark"] #panel .av {
    background: hsl(var(--av-h, 210) 32% 24%); color: hsl(var(--av-h, 210) 70% 80%);
  }
  #panel .av-2 { font-size: 9.5px; letter-spacing: -.02em; }
  #panel .who-chip .av-2 { font-size: 9px; }
  #panel .av-none { background: var(--panel); border: 2px solid var(--line-strong);
                    width: 12px; height: 12px; margin: 5px; }
  html[data-mode="dark"] #panel .av-none { background: var(--panel); }

  /* summary: the figures in one box, divided by hairlines. The rows are
     always full: four sit in one row or two by two, three in one row or one
     column, so no figure is left alone on a row. The hairlines are the box's
     own colour showing through a 1px gap, so they run edge to edge in any of
     those layouts. Auto-fit put four in three columns at the common panel
     width, the fourth alone on a second row with the lines broken around it
     (Forrest, 2026-09-28). */
  #panel .hist-sum-box { container-type: inline-size; margin: 0 0 14px; }
  #panel .hist-sum {
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  #panel .hist-sum[data-n="2"], #panel .hist-sum[data-n="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @container (min-width: 400px) {
    #panel .hist-sum[data-n="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @container (min-width: 560px) {
    #panel .hist-sum[data-n="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  #panel .hs-cell { min-width: 0; padding: 11px 14px 12px; background: var(--panel); }
  #panel .hs-label {
    color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase;
  }
  #panel .hs-value { margin-top: 4px; font-size: 15.5px; font-weight: 600; line-height: 1.3;
                     font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  #panel .hs-sub { margin-top: 1px; color: var(--muted); font-size: 12.5px; line-height: 1.4;
                   overflow-wrap: anywhere; }
  #panel .hist-who {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 6px;
    font-size: 13px;
  }
  #panel .hw-label { margin-right: 4px; color: var(--muted); }
  #panel .who-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 2px;
    border: 1px solid var(--line); border-radius: 999px; line-height: 20px;
  }
  #panel .who-chip .av { width: 20px; height: 20px; font-size: 10px; }
  #panel .who-chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  #panel .hist-moved { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
  #panel .hist-info code, #panel .hist-crumb code, #panel .hs-sub code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    background: var(--sunken); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3em;
  }
  #panel .hist-crumb {
    display: flex; align-items: flex-start; gap: 8px; margin: 0 0 16px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--sunken);
    color: var(--muted); font-size: 13px; line-height: 1.45;
  }
  #panel .hist-crumb svg { flex: none; width: 15px; height: 15px; margin-top: 1px; fill: none;
                           stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
  #panel a.hist-path { color: var(--link); text-decoration: none; }
  #panel a.hist-path:hover { text-decoration: underline; }

  /* revisions on a rail: a line down the initials, days labelled beside it.
     The list is its own stacking layer, so the z-index that lifts an initial
     over the rail stays inside it: at 1, the same as the pinned head's and
     later in the page, the initials painted over the head as the list
     scrolled under it (Forrest, 2026-09-27). */
  #panel .hist-list { list-style: none; margin: 14px 0 0; padding: 0; isolation: isolate; }
  #panel .hist-list > li { position: relative; }
  #panel .hist-list > li::before {
    content: ""; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px;
    background: var(--line);
  }
  #panel .hist-list > li:first-child::before { display: none; }
  /* the rail runs from the newest initial to the oldest, never past either:
     it ran from the top of the newest row and showed above its initial
     (Forrest, 2026-09-28). 19px is the initial's centre: 8px padding, -1px,
     half of 24px. */
  #panel .hist-list > .rev-day:first-child + .rev-item::before { top: 19px; }
  #panel .hist-list > .rev-item:last-child::before { bottom: auto; height: 19px; }
  #panel .hist-list > .rev-day:first-child + .rev-item:last-child::before { display: none; }
  #panel .hist-list .rev-day {
    padding: 16px 0 6px 34px; color: var(--muted); font-size: 12.5px; font-weight: 600;
  }
  #panel .hist-list > .rev-day:first-child { padding-top: 6px; }
  #panel .hist-list .rev {
    display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; column-gap: 10px;
    align-items: start; width: calc(100% + 16px); min-height: 0; margin: 0 -8px; padding: 8px;
    border: 0; border-radius: 8px; background: none; color: var(--text); font: inherit;
    text-align: left; cursor: pointer;
  }
  #panel .hist-list .rev:hover { background: var(--sunken); }
  html[data-mode="dark"] #panel .hist-list .rev:hover { background: color-mix(in srgb, var(--line) 60%, transparent); }
  #panel .rev-node { position: relative; z-index: 1; display: grid; place-items: center;
                     width: 24px; height: 24px; margin-top: -1px; }
  #panel .rev-node .av { box-shadow: 0 0 0 3px var(--panel); }
  #panel .rev:hover .rev-node .av { box-shadow: 0 0 0 3px var(--sunken); }
  #panel .rev-main { min-width: 0; }
  #panel .rev-text { display: block; font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
  #panel .rev-meta {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; margin-top: 2px;
    color: var(--muted); font-size: 12.5px; line-height: 1.45;
  }
  #panel .rev-meta time { font-variant-numeric: tabular-nums; }
  #panel .sep { color: var(--faint); }
  #panel .rev-who { color: var(--text); font-weight: 500; }
  #panel .rev-meta .rev-who { color: color-mix(in srgb, var(--text) 82%, var(--muted)); }
  #panel .rev-person { color: var(--muted); font-weight: 400; }
  #panel .rev-op.good { color: var(--good-text); }
  #panel .rev-op.bad { color: var(--bad-text); }
  #panel .rev-side {
    display: flex; align-items: center; gap: 8px; padding-top: 1px; white-space: nowrap;
    font-size: 12.5px; font-variant-numeric: tabular-nums;
  }
  #panel .rev-chev { width: 14px; height: 14px; fill: none; stroke: var(--faint); stroke-width: 1.6;
                     stroke-linecap: round; stroke-linejoin: round; opacity: 0;
                     transition: opacity .12s ease; }
  #panel .rev:hover .rev-chev, #panel .rev:focus-visible .rev-chev { opacity: 1; }
  #panel .rev-tag {
    padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 17px;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }
  #panel .hist-more {
    display: block; width: 100%; margin: 12px 0 0; padding: 0 12px; min-height: 32px;
    border: 1px solid var(--btn-line); border-radius: 8px; background: var(--panel); color: var(--text);
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  #panel .hist-more:hover { background: var(--btn-fill-hover); border-color: var(--btn-line-hover); }
  #panel .hist-more:active { background: var(--btn-fill-press); }

  /* one revision */
  #panel .rev-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                    margin: 0 0 16px; }
  #panel .rev-bar button {
    display: inline-flex; align-items: center; gap: 4px; min-height: 0; padding: 5px 10px;
    border: 0; background: none; color: var(--text); font: inherit; font-size: 13px; cursor: pointer;
  }
  #panel .rev-bar button svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
                               stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #panel .rev-bar .rev-back { margin-left: -8px; padding-left: 4px; border-radius: 6px; color: var(--link); }
  #panel .rev-bar .rev-back:hover { background: var(--sunken); }
  #panel .rev-nav { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px;
                    overflow: hidden; }
  #panel .rev-nav button + button { border-left: 1px solid var(--line-strong); }
  #panel .rev-nav button:hover:not(:disabled) { background: var(--sunken); }
  #panel .rev-nav button:disabled { color: var(--faint); cursor: default; }
  #panel .rev-head { margin: 0 0 16px; }
  #panel .rev-kicker {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px;
    color: var(--muted); font-size: 13px;
  }
  #panel .rev-kicker .av { margin-right: 1px; }
  #panel .rev-title { margin: 10px 0 0; font-size: 18px; font-weight: 600; line-height: 1.35;
                      overflow-wrap: anywhere; }
  #panel .rev-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
                      gap: 10px 14px; margin: 0 0 12px; }
  #panel .rev-tools:empty { display: none; }
  #panel .rev-stats { display: inline-flex; gap: 10px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  #panel .rev-show { display: inline-flex; padding: 2px; border: 1px solid var(--line);
                     border-radius: 8px; background: var(--sunken); }
  #panel .rev-show button {
    min-height: 0; padding: 4px 12px; border: 0; border-radius: 6px; background: none;
    color: var(--muted); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  #panel .rev-show button:hover { color: var(--text); }
  #panel .rev-show button[aria-pressed="true"] {
    background: var(--panel); color: var(--text);
    box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(16, 22, 26, .08);
  }
  html[data-mode="dark"] #panel .rev-show { background: var(--bg); }
  html[data-mode="dark"] #panel .rev-show button[aria-pressed="true"] {
    background: var(--line); box-shadow: none;
  }
  #panel .diff {
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px;
    line-height: 1.55;
  }
  #panel .diff .dh {
    padding: 4px 10px; background: var(--sunken); color: var(--muted);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px;
  }
  #panel .diff .dh:first-child { border-top: 0; }
  #panel .diff .dl { display: grid; grid-template-columns: 42px 16px minmax(0, 1fr); }
  #panel .diff .dn { padding-right: 8px; text-align: right; color: var(--faint); user-select: none;
                     font-variant-numeric: tabular-nums; }
  #panel .diff .ds { color: var(--muted); user-select: none; }
  #panel .diff .dt { padding-right: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #panel .diff .add { background: var(--good-bg); }
  #panel .diff .del { background: var(--bad-bg); }
  #panel .diff .add .ds { color: var(--good-text); }
  #panel .diff .del .ds { color: var(--bad-text); }
  #panel .diff mark { color: inherit; border-radius: 2px; }
  #panel .diff .add mark { background: color-mix(in srgb, var(--good-text) 26%, transparent); }
  #panel .diff .del mark { background: color-mix(in srgb, var(--bad-text) 24%, transparent); }

  /* ---- contents ----
     A page's sections, like Wikipedia's Contents. On a wide screen it is a
     column beside the text; "hide" folds it into a button left of the title,
     which opens the same list as a menu, and "move to sidebar" pins it back.
     The choice is kept per browser (Forrest, 2026-09-26).
     Hiding or showing it moves only the panel's left edge: the text keeps its
     exact width and place, so nothing rewraps and the reading position holds.
     The column takes the place of the text's left padding, so it adds its
     width and gap less that padding (--toc-add); it added the full 230px until
     2026-09-26 and the text narrowed by 24px on hiding it, rewrapping the page
     (Forrest). On screens wide enough to pin it, that room is held back from
     the widest a panel may be dragged (--toc-hold), so a wide panel cannot hit
     the maximum when the column appears and squeeze the text instead. */
  #panel { --toc-w: 204px; --toc-gap: 26px;
           --toc-add: calc(var(--toc-w) + var(--toc-gap) - var(--panel-pad)); }
  @media (min-width: 1000px) { #panel { --toc-hold: var(--toc-add); } }
  #panel.toc-pinned {
    --toc-room: var(--toc-add);
    display: grid; grid-template-columns: var(--toc-w) minmax(0, 1fr);
    column-gap: var(--toc-gap); align-items: start; padding-left: 0;
    /* lets the column size itself to the panel's height (cqh) */
    container-type: size;
  }
  #panel .panel-main { min-width: 0; }
  /* The head's negative margin reaches over the panel's left padding, which
     the pinned column replaces; left on, it reached 24px into the gap and its
     rule, once the page scrolled, crossed the boundary's line (2026-09-27). */
  #panel.toc-pinned .panel-head { margin-left: 0; padding-left: 0; }
  /* With the head flush to the text, anything hung left of the text, such as
     a list's "10." whose "1" sits outside the list's padding, showed beside
     the head as it scrolled under it (Forrest, 2026-10-01: 'The "1" in the
     "10" peeks to the left of the sticky header when scrolled'). The head's
     background reaches back to the column boundary, without its rule. */
  #panel.toc-pinned .panel-head::after {
    content: ""; position: absolute; top: 0; bottom: 0; right: 100%;
    width: calc(var(--toc-gap) / 2); background: var(--panel); pointer-events: none;
  }
  #panel .toc-side { display: none; }
  #panel.toc-pinned .toc-side {
    display: block; position: sticky; top: 0;
    max-height: calc(100dvh - 60px); max-height: 100cqh;
    overflow: auto; overscroll-behavior: contain; padding: 22px 6px 24px 24px;
  }
  .toc { font-size: 13.5px; }
  .toc-top {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .toc-top b { font-size: 14px; font-weight: 600; color: var(--text); }
  #panel .toc-pin {
    min-height: 0; padding: 4px 8px; border: 0; border-radius: 5px; cursor: pointer;
    background: var(--sunken); color: var(--text); font-size: 12px; line-height: 1.2;
    white-space: nowrap;
  }
  #panel .toc-pin:hover { background: var(--line); }
  html[data-mode="dark"] #panel .toc-pin:hover { background: var(--line-strong); }
  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc ul ul { padding-left: 14px; }
  .toc li { position: relative; }
  .toc li.shut > ul { display: none; }
  .toc a { display: block; padding: 4px 0; line-height: 1.35; color: var(--link);
           text-decoration: none; overflow-wrap: anywhere; }
  .toc a:hover { text-decoration: underline; }
  .toc a.on { color: var(--text); font-weight: 600; }
  /* the chevron hangs in the gutter, so every entry's text lines up */
  #panel .toc-chev {
    position: absolute; left: -19px; top: 3px; width: 18px; height: 20px; min-height: 0;
    display: grid; place-items: center; padding: 0; border: 0; border-radius: 4px;
    background: none; color: var(--muted); cursor: pointer;
  }
  #panel .toc-chev:hover { color: var(--text); background: var(--sunken); }
  .toc-chev svg { width: 10px; height: 10px; fill: none; stroke: currentColor;
                  stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
                  transition: transform .12s ease; }
  .toc li.shut > .toc-chev svg { transform: rotate(-90deg); }
  /* folded away: a quiet button left of the title opens it as a menu */
  #panel .toc-btn {
    display: none; flex: none; width: 34px; height: 34px; margin: 0 -6px 0 -8px; padding: 0;
    border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  #panel.has-toc:not(.toc-pinned) .toc-btn { display: inline-grid; place-items: center; }
  #panel .toc-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor;
                        stroke-width: 2; stroke-linecap: round; }
  #panel .toc-btn:hover, #panel .toc-btn[aria-expanded="true"] {
    background: var(--sunken); color: var(--text);
  }
  html[data-mode="dark"] #panel .toc-btn:hover,
  html[data-mode="dark"] #panel .toc-btn[aria-expanded="true"] { background: var(--line); }
  #panel .toc-btn:focus-visible {
    outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  #panel .toc-pop {
    position: absolute; top: calc(100% - 6px); left: 14px; z-index: 3;
    width: min(300px, calc(100% - 28px)); max-height: min(60vh, 460px);
    overflow: auto; overscroll-behavior: contain; padding: 12px 14px 10px 26px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow);
  }
  #panel .toc-pop[hidden] { display: none; }
  /* too narrow for the column: nothing to move to */
  @media (max-width: 999px) { #panel .toc-pop .toc-pin { display: none; } }

  /* ---- rendered page body ---- */
  .md { font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
  .md img.md-img { max-width: 100%; height: auto; border-radius: 4px; }
  .md > :first-child { margin-top: 0; }
  /* Headings read like Wikipedia's: a section (##, or a second #) in the
     serif with a rule under it, a subsection (###) in bold, a size up from
     the text. Sections were 15px bold, the text's own size, and hard to find
     in a long page (Forrest, 2026-09-26). */
  .md h2, .md h3 {
    font-family: var(--serif); font-weight: 400; line-height: 1.3; color: var(--text);
    margin: 1.2em 0 .45em; padding-bottom: .15em; border-bottom: 1px solid var(--line-strong);
  }
  .md h2 { font-size: 25px; }
  .md h3 { font-size: 22px; }
  .md h4, .md h5, .md h6 { margin: 1.3em 0 .35em; line-height: 1.35; font-weight: 700; }
  .md h4 { font-size: 17px; }
  .md h5 { font-size: 15px; }
  .md h6 { font-size: 14px; color: var(--muted); }
  .md h2 + h3, .md h3 + h4, .md h4 + h5 { margin-top: .6em; }
  /* A heading's link (graph.js, app only): its section's address, shown on
     hover or focus as GitHub's heading anchors are, to open or copy. */
  .md .h-link {
    display: inline-grid; place-items: center; width: 1em; height: 1em;
    margin-left: .3em; vertical-align: -.08em; border-radius: 4px;
    color: var(--muted); opacity: 0; transition: opacity .12s ease;
  }
  .md .h-link svg { width: .68em; height: .68em; fill: none; stroke: currentColor;
                    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .md :is(h2, h3, h4, h5, h6):hover .h-link, .md .h-link:focus-visible { opacity: 1; }
  .md .h-link:hover { color: var(--link); text-decoration: none; }
  .md .h-link:focus-visible {
    outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  @media (hover: none) { .md .h-link { display: none; } }
  .md p { margin: .7em 0; }
  .md ul, .md ol { margin: .6em 0; padding-left: 1.3em; }
  .md li { margin: .25em 0; }
  /* blocks inside a list item (graph.js listItemBody): a sub-list sits close
     under its item; code and later paragraphs keep their usual spacing */
  .md li > ul, .md li > ol { margin: .25em 0; }
  .md li > pre { margin: .6em 0; }
  .md li > p { margin: .5em 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
  .md blockquote {
    margin: .8em 0; padding: .1em 0 .1em .9em;
    border-left: 3px solid var(--line-strong); color: var(--muted);
  }
  .md code {
    background: var(--sunken); border: 1px solid var(--line); border-radius: 4px;
    padding: .08em .32em; font-size: .88em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .md pre { margin: .8em 0; }
  .md pre code { background: none; border: 0; padding: 0; font-size: 12.5px; }
  /* the search's words in the open page (graph.js markTerms): find-in-page
     yellow in every colour theme (--hit, themes.py); the ring widens it
     without moving text */
  #panel mark.hit { background: var(--hit); box-shadow: 0 0 0 1px var(--hit); color: inherit; border-radius: 2px; }
  .md a { color: var(--link); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  /* a wikilink that resolves: subtle underline so it reads as internal */
  .md a.wl {
    text-decoration: underline;
    text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent);
    text-underline-offset: 2px;
  }
  /* a wikilink that points at nothing: shown, but visibly broken rather than
     silently rendered as ordinary text */
  .md .wl-missing {
    color: var(--muted); border-bottom: 1px dashed var(--line-strong);
    cursor: help;
  }
  .md strong { font-weight: 600; }
  /* tables scroll sideways in a narrow panel rather than breaking words
     mid-letter, which .md's overflow-wrap would otherwise do to fit */
  .md .table-wrap { overflow-x: auto; margin: .8em 0; }
  .md table { border-collapse: collapse; font-size: 14px; line-height: 1.45;
              overflow-wrap: normal; }
  .md th, .md td { border: 1px solid var(--line); padding: .35em .7em;
                   text-align: left; vertical-align: top; }
  .md th { background: var(--sunken); font-weight: 600; }
  .md tbody tr:nth-child(even) td {
    background: color-mix(in srgb, var(--sunken) 45%, transparent);
  }
  /* Footnotes (graph.js): a citation reads [1], as Wikipedia's do, and the
     notes are a smaller list at the end of the page under a rule, or under
     the page's own heading when the notes were written beneath one. */
  .md sup.fn-ref { font-size: .72em; line-height: 0; vertical-align: super; white-space: nowrap; }
  .md sup.fn-ref a::before { content: "["; }
  .md sup.fn-ref a::after { content: "]"; }
  .md .footnotes { margin-top: 1.6em; padding-top: .5em; border-top: 1px solid var(--line);
                   font-size: 13.5px; line-height: 1.5; }
  .md :is(h2, h3, h4, h5, h6) + .footnotes { margin-top: .4em; padding-top: 0; border-top: 0; }
  .md .footnotes ol { margin: .4em 0; padding-left: 1.8em; }
  .md .footnotes li { margin: .3em 0; padding: 0 .2em; border-radius: 3px; }
  .md .footnotes li p { margin: .3em 0; }
  .md .fn-back { text-decoration: none; }
  .md .fn-back sup { font-size: .75em; }
  .md .fn-lit { background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 3px; }
  /* Close: a quiet icon button that fills in on hover, rather than a boxed
     word. Esc closes too (graph.js). Focus sits left of it, drawn the same
     way; the two share a box so the head's layouts place them as one. */
  #panel .head-acts { flex: none; display: flex; gap: 2px; }
  #panel #close, #panel .focus-btn {
    flex: none; display: inline-grid; place-items: center;
    width: 34px; height: 34px; padding: 0; cursor: pointer;
    border: 0; border-radius: 8px; background: transparent; color: var(--muted);
    transition: background .12s ease, color .12s ease;
  }
  #panel #close svg, #panel .focus-btn svg {
    width: 18px; height: 18px; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #panel .focus-btn svg { width: 17px; height: 17px; }
  #panel #close:hover, #panel .focus-btn:hover { background: var(--sunken); color: var(--text); }
  html[data-mode="dark"] #panel #close:hover,
  html[data-mode="dark"] #panel .focus-btn:hover { background: var(--line); }
  #panel #close:active, #panel .focus-btn:active { transform: scale(.94); }
  #panel #close:focus-visible, #panel .focus-btn:focus-visible {
    outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  }

  /* ---- focus ----
     Forrest, 2026-10-05: "can we get a focus mode for wiki pages?" The open
     page takes the whole window under the header: the graph, the folders and
     the controls over the graph go, and the page's text and its contents sit
     in the middle. The text keeps the width it had in the panel, so nothing
     rewraps and the reading position holds; drag the panel wider first for
     longer lines. The header stays, as it does over a page on a phone: search
     and Share for the open page live there. The button left of Close, or F,
     turns it on and off; Esc leaves it before it would close the page; links
     followed and pages opened from search stay in it; closing the page ends
     it. Phones have no button: the page already fills the screen there. */
  #panel .focus-btn { display: none; }
  @media (min-width: 721px) {
    #panel .focus-btn { display: inline-grid; }
    #wrap.page-focus > :not(#panel, #toast) { visibility: hidden; }
    #wrap.page-focus #panel {
      --focus-side: max(0px, calc((100% - var(--panel-box)) / 2));
      left: 0; width: auto; min-width: 0; max-width: none;
      border-left-color: transparent; box-shadow: none;
      padding-left: calc(var(--focus-side) + var(--panel-pad));
      padding-right: calc(var(--focus-side) + var(--panel-pad));
    }
    #wrap.page-focus #panel.toc-pinned { padding-left: var(--focus-side); }
  }

  /* ---- going back (graph.js, "going back") ----
     The page you came from is the head's first row, "← Morning blend" in link
     colour, with the close button at its right. The contents button and the
     title share the row under it, so folding the contents away moves nothing,
     and the arrow sits over the contents icon on the text's left edge. One
     layout with the contents shown or hidden, and on a phone (Forrest,
     2026-09-28, option B of three). The close button's margins take it out
     of the row's height, so the line adds its own 20px and no more. */
  #panel .panel-head.has-back {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
    column-gap: 12px; align-items: start;
  }
  #panel .panel-head.has-back .back-row { grid-row: 1; grid-column: 1 / 3; display: flex;
                                          min-width: 0; margin-bottom: 2px; }
  #panel .panel-head.has-back .head-acts { grid-row: 1; grid-column: 3; align-self: center;
                                           margin: -8px 0; }
  #panel .panel-head.has-back .toc-btn { grid-row: 2; grid-column: 1; }
  #panel .panel-head.has-back .panel-title { grid-row: 2; grid-column: 2 / 4; }
  #panel:not(.has-toc) .panel-head.has-back .panel-title,
  #panel.toc-pinned .panel-head.has-back .panel-title { grid-column: 1 / 4; }
  #panel .panel-head.has-back .panel-tabs { grid-row: 3; grid-column: 1 / -1; }
  #panel .back-line {
    display: inline-flex; align-items: center; gap: 4px; max-width: 100%; vertical-align: top;
    margin: -3px 0 -3px -2px; padding: 3px 2px; border-radius: 4px;
    color: var(--link); font-size: 13px; line-height: 18px; text-decoration: none;
  }
  #panel .back-line span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel .back-line svg { flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor;
                          stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #panel .back-line:hover span { text-decoration: underline; }
  #panel .back-line:focus-visible {
    outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  }

  /* A short message over the graph (render.py's switcher), such as an address
     naming a page the wiki does not have. It goes by itself after a while. */
  #toast {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 8;
    max-width: min(520px, calc(100% - 28px)); padding: 9px 14px; border-radius: 8px;
    background: var(--text); color: var(--bg); font-size: 13px; line-height: 1.45;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .18); overflow-wrap: anywhere;
  }
  #toast[hidden] { display: none; }

  /* ---- sharing (server/shares.py, static/share.js) ----
     Header buttons: Share for members; Sign in and Try Dexio free for someone
     with a public link and no account. Quiet in the chrome's colours, the
     primary one filled, as the app's buttons are (server/login.py). */
  header .hbtn {
    display: inline-flex; align-items: center; gap: 6px; flex: none; height: 34px;
    padding: 0 12px; border: 1px solid var(--chrome-field-line); border-radius: 6px;
    background: var(--chrome-field); color: var(--chrome-text); font: inherit; font-size: 13.5px;
    font-weight: 600; white-space: nowrap; text-decoration: none; cursor: pointer;
    transition: border-color .12s ease, background-color .12s ease;
  }
  header .hbtn:hover { border-color: var(--chrome-muted); }
  header .hbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px;
                               box-shadow: none; }
  header .hbtn-primary { background: var(--btn); border-color: transparent; color: var(--btn-text); }
  header .hbtn-primary:hover { background: var(--btn-hover); border-color: transparent; }
  header .hbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor;
                     stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  @media (max-width: 520px) { header #share-wiki span, header #publish-wiki span { display: none; }
                              header #share-wiki, header #publish-wiki { padding: 0 9px; }
                              /* one row on a phone: the logo, the workspace, Try Dexio free */
                              header .guest-tag,
                              header .hbtn:not(.hbtn-primary):not(#share-wiki):not(#publish-wiki) {
                                display: none; }
                              header .hbtn-primary { margin-left: auto; } }
  /* What a guest opened: the sharing workspace's name, then View only. */
  header .guest-ws { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 0 6px;
                     font-size: 14px; white-space: nowrap; }
  header .guest-tag { flex: none; margin-left: 4px; padding: 2px 8px; border-radius: 999px;
                      border: 1px solid var(--chrome-field-line); color: var(--chrome-muted);
                      font-size: 12px; white-space: nowrap; }
  /* A link on a shared page to something not shared reads as plain text. */
  #panel .wl-hidden { color: inherit; }
  /* A folder row (graph.js, "one folder"; Forrest 2026-09-29): a click on the
     row opens and closes it, and the arrow at its right drills in. The arrow
     shows on hover or keyboard focus, over the page count; on a touch screen
     it always shows, after the count. A folder is shared from the header once
     drilled into (no Share in the tree since 2026-09-28, Forrest). */
  #tree .row.dir .twisty { display: inline-grid; place-items: center; flex: none;
    width: 18px; height: 20px; margin: -2px -4px -2px -5px; border-radius: 4px; }
  #tree .dir-line { position: relative; }
  #tree .dir-line:hover > .row.dir { background: var(--sunken); }
  #tree .drill { position: absolute; top: 50%; right: 3px; transform: translateY(-50%);
    display: none; place-items: center; width: 24px; height: 22px; padding: 0; margin: 0;
    border: 0; border-radius: 4px; background: none; color: var(--muted); cursor: pointer; }
  #tree .drill svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
                     stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #tree .drill:hover { background: var(--line); color: var(--text); }
  #tree .dir-line:hover > .drill, #tree .row.dir:focus-visible + .drill { display: grid; }
  #tree .dir-line:hover > .row.dir .count,
  #tree .row.dir:focus-visible .count { visibility: hidden; }
  @media (hover: none) {
    #tree .drill { display: grid; width: 36px; height: 100%; right: 0; }
    #tree .dir-line > .row.dir { padding-right: 40px; }
    #tree .dir-line:hover > .row.dir .count { visibility: visible; }
  }
  /* Drilled in: a row back up, then the folder's own name over its contents. */
  #tree .row.up { color: var(--link); font-size: 13px; gap: 4px; }
  #tree .row.up svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2;
                      stroke-linecap: round; stroke-linejoin: round; }
  #tree .tree-here { display: flex; align-items: center; gap: 7px; padding: 6px 8px 4px;
                     color: var(--text); font-weight: 600; }
  #tree .tree-here svg { flex: none; width: 15px; height: 15px; fill: none; stroke: var(--muted);
                         stroke-width: 1.5; stroke-linejoin: round; }

  /* Over the graph, beside Layout, while a folder is drilled into: Show (the
     folder only, or with the pages elsewhere linked to it, faded), then the
     folder pill, its path with each parent a step back up, and a way out. */
  #layout-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
                 max-width: calc(100% - 66px); }
  #show-pick { position: relative; }
  #show-pick[hidden] { display: none; }
  #show-button {
    display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 8px 0 10px;
    border: 1px solid var(--line-strong); border-radius: 9px; background: var(--panel);
    box-shadow: 0 2px 8px rgba(16, 22, 26, .10); color: var(--text);
    font-size: 13px; white-space: nowrap; cursor: pointer;
  }
  #show-button:hover, #show-button[aria-expanded="true"] { border-color: var(--accent); }
  #show-button .lo-cap { color: var(--muted); }
  #show-button .lo-now { font-weight: 600; }
  #show-button .sw-chev { stroke: var(--muted); }
  #show-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: 280px;
    max-width: calc(100vw - 24px); padding: 6px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--panel); color: var(--text); box-shadow: var(--shadow);
  }
  #show-menu[hidden] { display: none; }
  #show-menu .sw-item { align-items: flex-start; padding: 8px 10px; }
  #show-menu .lo-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  #show-menu .lo-desc { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
  #show-menu .sw-check { margin-left: auto; margin-top: 1px; }
  #focus-chip {
    display: inline-flex; align-items: center; gap: 6px; min-width: 0; height: 34px;
    padding: 0 3px 0 10px; border: 1px solid var(--accent); border-radius: 9px;
    background: color-mix(in srgb, var(--accent) 9%, var(--panel)); color: var(--text);
    box-shadow: 0 2px 8px rgba(16, 22, 26, .10); font-size: 13px;
  }
  #focus-chip[hidden] { display: none; }
  /* With the folder tree showing, the tree already says which folder is open
     and leads back up, so the pill goes (Forrest, 2026-09-28: "we don't need
     the blue bordered pill ... since we already control the filter using the
     nesting level of the folder sidebar"). It stays for a hidden tree: a phone,
     where the tree is a closed drawer, or a tree put away. */
  #wrap.tree-open #focus-chip { display: none; }
  #focus-chip > svg { flex: none; width: 15px; height: 15px; fill: none; stroke: var(--accent);
                      stroke-width: 1.5; stroke-linejoin: round; }
  #focus-chip .fc-path { display: flex; align-items: center; min-width: 0; overflow: hidden;
                         white-space: nowrap; }
  #focus-chip .fc-seg { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #focus-chip button.fc-seg { height: 26px; min-height: 0; padding: 0 3px; border: 0; border-radius: 5px;
                              background: none; color: var(--link); font: inherit; cursor: pointer; }
  #focus-chip button.fc-seg:hover { background: var(--sunken); text-decoration: underline; }
  #focus-chip .fc-here { font-weight: 600; padding: 0 2px; }
  #focus-chip .fc-sep { color: var(--muted); padding: 0 1px; }
  #focus-chip .fc-x {
    flex: none; display: grid; place-items: center; width: 28px; height: 28px; min-height: 0;
    padding: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer;
  }
  #focus-chip .fc-x:hover { background: var(--sunken); color: var(--text); }
  #focus-chip .fc-x svg { width: 15px; height: 15px; fill: none; stroke: currentColor;
                          stroke-width: 1.8; stroke-linecap: round; }
  #focus-chip button:focus-visible, #show-button:focus-visible { outline: 2px solid var(--accent);
    outline-offset: 1px; box-shadow: none; }

  /* The Share dialog, laid out as Google Docs' is. */
  body.sd-open { overflow: hidden; }
  .sd-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
                 padding: 12px; background: rgba(10, 14, 18, .42); }
  .sd-backdrop[hidden] { display: none; }
  .sd-box { width: min(540px, 100%); max-height: calc(100dvh - 24px); overflow: auto;
            padding: 22px 24px 18px; border: 1px solid var(--line); border-radius: 12px;
            background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  .sd-box h2 { margin: 0 0 4px; font-size: 19px; font-weight: 600; overflow-wrap: anywhere; }
  /* The title, and a quiet close button at its right, as the page panel's
     (Forrest, 2026-10-01: "This modal is also missing a close button"). Esc
     and a click outside close it too. */
  .sd-head { display: flex; align-items: flex-start; gap: 12px; }
  .sd-head h2 { flex: 1 1 auto; min-width: 0; }
  .sd-close {
    flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px;
    margin: -5px -8px 0 0; padding: 0; border: 0; border-radius: 8px; background: transparent;
    color: var(--muted); cursor: pointer; transition: background .12s ease, color .12s ease;
  }
  .sd-close svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6;
                  stroke-linecap: round; }
