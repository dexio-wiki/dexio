  .sd-close:hover { background: var(--sunken); color: var(--text); }
  html[data-mode="dark"] .sd-close:hover { background: var(--line); }
  .sd-close:active { transform: scale(.94); }
  .sd-close:focus-visible { outline: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  .sd-what { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .sd-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12.5px;
              font-weight: 600; }
  .sd-row { display: flex; gap: 8px; }
  .sd-row input { flex: 1 1 auto; min-width: 0; height: 38px; background: var(--field); }
  /* Viewer or Editor, and Restricted or Public: buttons opening a menu (share.js,
     picker), never a native select (Forrest, 2026-09-28: "as a standing rule we
     should not use native browser dropdowns"). Role sits in the row as a field,
     the height of the email box; Visibility is quiet bold text with a
     chevron, as Google Docs' is. */
  #share-dlg .sd-pick {
    display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 0;
    color: var(--text); font: inherit; font-size: 14px; white-space: nowrap; cursor: pointer;
    transition: background-color .12s ease, border-color .12s ease;
  }
  #share-dlg .sd-pick[hidden] { display: none; }
  #share-dlg .sd-pick .sw-chev { width: 14px; height: 14px; stroke: var(--muted); stroke-width: 1.8;
                                 transition: transform .12s ease; }
  #share-dlg .sd-pick[aria-expanded="true"] .sw-chev { transform: rotate(180deg); }
  #share-dlg .sd-role-pick {
    justify-content: space-between; min-width: 104px; height: 38px; padding: 0 9px 0 12px;
    border: 1px solid var(--line-strong); border-radius: 6px; background: var(--field);
  }
  #share-dlg .sd-role-pick:hover, #share-dlg .sd-role-pick[aria-expanded="true"] {
    border-color: var(--accent); }
  /* Where only Viewer is on offer (a folder, a page): the role, fixed, in the
     picker's place. A plain field look, no chevron, so it reads as a fact. */
  .sd-role-fixed {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; flex: none;
    min-width: 104px; height: 38px; padding: 0 12px; border: 1px solid var(--line);
    border-radius: 6px; background: color-mix(in srgb, var(--muted) 14%, var(--panel));
    color: var(--text); font-size: 14px; white-space: nowrap; cursor: default;
  }
  .sd-role-fixed[hidden] { display: none; }
  .sd-role-fixed svg { width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 1.5;
                       stroke-linecap: round; stroke-linejoin: round; }
  #share-dlg .sd-access-pick {
    height: 30px; margin: 0 0 0 -8px; padding: 0 6px 0 8px; border: 1px solid transparent;
    border-radius: 6px; background: none; font-weight: 600;
  }
  #share-dlg .sd-access-pick:hover, #share-dlg .sd-access-pick[aria-expanded="true"] {
    background: var(--sunken); }
  html[data-mode="dark"] #share-dlg .sd-access-pick:hover,
  html[data-mode="dark"] #share-dlg .sd-access-pick[aria-expanded="true"] { background: var(--line); }
  /* set by a folder above: a label, not a control */
  #share-dlg .sd-access-pick:disabled { background: none; cursor: default; }
  #share-dlg .sd-access-pick:disabled .sw-chev { display: none; }
  #share-dlg .sd-pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px;
                                      box-shadow: none; }
  /* the open menu: fixed over the backdrop, placed under (or over) its button */
  .sd-menu {
    position: fixed; z-index: 1; width: 300px; max-width: calc(100vw - 24px); padding: 6px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    color: var(--text); box-shadow: var(--shadow);
  }
  .sd-menu[hidden] { display: none; }
  .sd-menu .sw-item { align-items: flex-start; gap: 11px; padding: 9px 10px; }
  .sd-menu .sw-item:disabled { cursor: default; background: none; }
  .sd-menu .sw-item:disabled .sw-name, .sd-menu .sw-item:disabled .sd-micon { opacity: .5; }
  .sd-menu .sd-micon { flex: none; display: grid; place-items: center; width: 16px; height: 16px;
                       margin-top: 1px; color: var(--muted); }
  .sd-menu .sd-micon svg { width: 16px; height: 16px; fill: none; stroke: currentColor;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .sd-menu .sw-item[aria-checked="true"] .sd-micon { color: var(--accent); }
  .sd-menu .lo-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .sd-menu .lo-desc { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
  .sd-menu .sw-check { margin-left: auto; margin-top: 1px; }
  .sd-box button { font: inherit; }
  .sd-primary, .sd-quiet {
    display: inline-flex; align-items: center; justify-content: center; height: 38px;
    padding: 0 16px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-color .12s ease, border-color .12s ease;
  }
  .sd-primary { border: 1px solid transparent; background: var(--btn); color: var(--btn-text); }
  .sd-primary:hover { background: var(--btn-hover); }
  .sd-primary:active { background: var(--btn-press); }
  .sd-quiet { border: 1px solid var(--btn-line); background: var(--panel); color: var(--text); }
  .sd-quiet:hover { background: var(--btn-fill-hover); border-color: var(--btn-line-hover); }
  .sd-primary:focus-visible, .sd-quiet:focus-visible { outline: 2px solid var(--accent);
    outline-offset: 2px; box-shadow: none; }
  .sd-hint { margin: 8px 0 0; color: var(--muted); font-size: 12.5px; }
  .sd-msg { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  .sd-msg:empty { display: none; }
  .sd-avatar.sd-team { color: var(--muted); }
  .sd-avatar svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.5;
                   stroke-linecap: round; stroke-linejoin: round; }
  .sd-msg.bad { color: var(--bad-text); }
  .sd-h { margin: 18px 0 6px; font-size: 13.5px; font-weight: 600; }
  .sd-people { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow: auto; }
  .sd-person { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 0; }
  .sd-avatar { flex: none; display: grid; place-items: center; width: 30px; height: 30px;
               border-radius: 50%; background: hsl(var(--h, 210) 45% 45%); color: var(--btn-text);
               font-size: 12px; font-weight: 700; }
  .sd-avatar.sd-team { background: var(--sunken); }
  .sd-who { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
  .sd-name, .sd-email, .sd-note { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sd-name { font-size: 14px; }
  .sd-email, .sd-note { color: var(--muted); font-size: 12.5px; }
  .sd-role { flex: none; color: var(--muted); font-size: 13px; }
  .sd-remove { flex: none; display: inline-grid; place-items: center; width: 30px; height: 30px;
               min-height: 0; padding: 0; border: 0; border-radius: 6px; background: none;
               color: var(--muted); cursor: pointer; }
  .sd-remove:hover { background: var(--sunken); color: var(--text); }
  .sd-remove svg, .sd-gicon svg { width: 16px; height: 16px; fill: none; stroke: currentColor;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .sd-loading { color: var(--muted); padding: 10px 0; }
  .sd-general { display: flex; align-items: flex-start; gap: 12px; }
  .sd-gicon { flex: none; display: grid; place-items: center; width: 30px; height: 30px;
              border-radius: 50%; background: var(--sunken); color: var(--muted); }
  .sd-general.open .sd-gicon { background: color-mix(in srgb, var(--accent) 18%, transparent);
                               color: var(--accent); }
  .sd-gnote { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  /* Share's line on whether it is published, under Visibility. */
  .sd-pubrow { margin: 12px 0 0 42px; color: var(--muted); font-size: 12.5px; }
  .sd-pubrow[hidden] { display: none; }
  /* Publish (publish.js): the share dialog's box and fields, a picture of the graph. */
  .sd-lf { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); }
  .sd-lf input, .sd-lf textarea { width: 100%; min-height: 34px; padding: 6px 10px; font: inherit;
    font-size: 14px; color: var(--text); background: var(--field, var(--panel));
    border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
  .sd-lf input:focus, .sd-lf textarea:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .pd-scope { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
  .pd-scope[hidden] { display: none; }
  .pd-pill { min-height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
  .pd-pill[aria-checked="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600;
    background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
  .pd-status { margin: 0 0 10px; font-size: 13px; color: var(--text); }
  .pd-status[hidden] { display: none; }
  .pd-status a { color: var(--accent); }
  .pd-shot { position: relative; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; background: var(--panel); aspect-ratio: 16 / 9; }
  .pd-shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pd-size { position: absolute; right: 8px; bottom: 6px; padding: 1px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--panel) 90%, transparent); color: var(--muted);
    font-size: 12px; }
  .pd-fields { display: flex; flex-direction: column; gap: 8px; }
  .pd-by { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .pd-by b { color: var(--text); font-weight: 600; }
  .pd-by a { color: var(--link); }
  .pd-box .sd-foot { align-items: center; }
  .pd-gap { flex: 1; }
  /* Published on dexio.wiki, under Visibility, lined up with its text. */
  .sd-publish { margin: 12px 0 0 42px; }
  .sd-publish[hidden], .sd-publish label[hidden], .sd-publish button[hidden] { display: none; }
  .sd-publish .pd-shot { margin: 0 0 10px; }
  .sd-publish .pd-by { margin: 8px 0 0; }
  /* Publish, the second press Published takes; once published, a greyed
     Published, which turns into Save after an edit. */
  .sd-pfoot { display: flex; justify-content: flex-end; margin-top: 12px; }
  .sd-pfoot .sd-pub:disabled { border-color: var(--line); background: var(--sunken); color: var(--muted);
                               cursor: default; }
  .sd-whosec[hidden] { display: none; }
  /* The address under Visibility, Copy at its end; a click on it selects all of it. */
  .sd-link { display: flex; align-items: stretch; margin: 12px 0 0 42px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--sunken); overflow: hidden; }
  .sd-url { flex: 1; min-width: 0; align-self: center; padding: 0 10px; color: var(--muted);
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    user-select: all; -webkit-user-select: all; cursor: text; }
  .sd-link .sd-copy { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px;
    padding: 0 12px; border: 0; border-left: 1px solid var(--line); background: var(--panel);
    color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
  .sd-link .sd-copy:hover { background: var(--btn-fill-hover); }
  .sd-link .sd-copy:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .sd-link.done .sd-copy { color: var(--accent); }
  .sd-link svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round; }
  /* Visibility opens the dialog; the people under Restricted follow, set apart. */
  .sd-h.sd-first { margin-top: 0; }
  .sd-whosec { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  #sd-g-msg { margin: 8px 0 0 42px; }
  @media (max-width: 480px) { .sd-publish, .sd-link, #sd-g-msg { margin-left: 0; } }
  /* the dialog's buttons set display, which would show one marked hidden */
  .pd-box button[hidden], .pd-box label[hidden], .pd-box p[hidden] { display: none; }
  .sd-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
  @media (max-width: 480px) {
    .sd-box { padding: 18px 16px 14px; }
    .sd-row { flex-wrap: wrap; }
    .sd-row input { flex-basis: 100%; font-size: 16px; }
    #share-dlg .sd-row .sd-role-pick, .sd-row .sd-role-fixed, .sd-row .sd-primary { flex: 1 1 0; }
    .sd-menu .sw-item { min-height: var(--tap); }
  }

  footer {
    position: absolute; left: 14px; bottom: max(12px, env(safe-area-inset-bottom));
    color: var(--faint); font-size: 11.5px; pointer-events: none;
  }

  /* ---- narrow screens ---- */
  /* Too narrow for the three columns: search gets its own row under the
     logo, the workspace menu and settings. The app gets there first (1140px
     fits the longest names the menu shows). The exported file has its own
     rules (header.export, above). */
  @media (max-width: 1140px) {
    header:has(#crumbs):not(.export) { display: flex; flex-wrap: wrap; row-gap: 8px; }
    header:has(#crumbs):not(.export) .h-end { margin-left: auto; }
    header:has(#crumbs):not(.export) #find { order: 10; flex: 1 1 100%; max-width: none; }
  }
  @media (max-width: 820px) {
    header { display: flex; flex-wrap: wrap; row-gap: 8px; }
    header .h-end { margin-left: auto; }
    header #find { order: 10; flex: 1 1 100%; max-width: none; }
  }
  @media (max-width: 720px) {
    /* rows rather than columns: the brand, the wiki picker and settings on
       the first, then search across the full width, then the counts */
    header { display: flex; flex-wrap: wrap; gap: 8px 10px; padding: 8px 12px; }
    header .h-start, header .h-end { display: contents; }
    header #acct { margin-left: auto; }
    /* Share (members) or Sign in (a public link) keeps to the right too */
    header .h-end > :first-child { margin-left: auto; }
    header #share-wiki + #acct { margin-left: 0; }
    /* the tree is a drawer over the graph and the page sheet, closed until
       asked for */
    #tree {
      z-index: 4; width: min(300px, 86vw); max-width: none;
    }
    #tree-grip { display: none; }   /* a drawer here, at a fixed width */
    #tree-list { padding-bottom: 40px; }
    #tree-close, #tree-open { width: var(--tap); height: var(--tap); }
    /* the tree is a drawer here, so the menu stays beside its button */
    #layout-pick, #wrap.tree-open #layout-pick { left: 60px; }
    #layout-button { height: var(--tap); }
    #layout-menu .sw-item { min-height: var(--tap); }
    #tree .row { min-height: 36px; }
    header h1 { font-size: 14px; }
    #find { order: 10; flex: 1 1 100%; max-width: none; }
    #search { font-size: 16px; }   /* 16px: iOS zooms into smaller fields */

    /* the side panel becomes a sheet: a 420px drawer is unusable at 390px
       wide. It fills the screen below the header; it was 72dvh with the
       graph showing above it (Forrest, 2026-10-01: "On mobile can we have
       the wiki page take up the full height of the screen?"). It stops at
       the header rather than covering it: Share for the open page and
       search live there, and nowhere else. */
    #panel {
      top: 0; bottom: 0; right: 0; left: 0;
      width: 100%; min-width: 0; max-width: none; height: 100%;
      border-left: 0;
      padding: 0 16px max(16px, env(safe-area-inset-bottom));
      transform: translateY(100%);
    }
    #panel.open { transform: none; }
    /* The browser never scrolls from the head, so a pull on it is always the
       sheet's (graph.js, "bottom sheet"). Without it, on an iPhone with the
       page scrolled, a pull on the grab handle did nothing: the browser
       took it as a scroll back up the text before the script could claim
       it. Chrome's touch emulation never showed it (Forrest, 2026-10-01: "The tab pull down doesn't work unless
       the content is unscrolled"). Taps on its buttons still work, and the
       contents menu inside it scrolls: a scroller starts its own count. */
    #panel .panel-head { margin: 0 -16px 12px; padding: 22px 10px 10px 16px;
                         touch-action: none; }
    /* grab handle, so it reads as a sheet you can dismiss; it rides in the
       sticky head so it stays visible while the page scrolls */
    #panel .panel-head::before {
      content: ""; position: absolute; top: 8px; left: 50%; margin-left: -18px;
      width: 36px; height: 4px; border-radius: 2px; background: var(--line-strong);
    }
    #panel #close { width: 40px; height: 40px; margin-top: -4px; }
    #panel .toc-btn { width: 40px; height: 40px; margin-top: -4px; }
    #panel .panel-head.has-back .head-acts { margin: -11px 0; }
    #panel .panel-head.has-back #close { margin: 0; }
    /* the back line's text is small; its tap area is not */
    #panel .back-line { margin: -10px 0 -10px -2px; padding: 10px 2px; }
    #panel .panel-title h2 { font-size: 22px; }
    /* history: tabs tall enough to tap, the word count under a revision's
       meta line rather than beside it, a narrower diff gutter */
    #panel .panel-head.has-tabs { margin-bottom: 16px; }
    #panel .panel-tabs { margin-right: 6px; }
    #panel .panel-tabs [role="tab"] { padding: 9px 1px 12px; }
    #panel .hist-list .rev { grid-template-columns: 24px minmax(0, 1fr); padding: 10px 8px; }
    #panel .rev-side { grid-column: 2; justify-self: start; margin-top: 5px; padding-top: 0; }
    #panel .rev-side:not(:has(.rev-tag, .rev-words)) { display: none; }
    #panel .rev-chev { display: none; }
    #panel .hist-list > .rev-item:last-child::before { height: 21px; }
    #panel .diff .dl { grid-template-columns: 34px 14px minmax(0, 1fr); }
    .md h2 { font-size: 22px; }
    .md h3 { font-size: 20px; }
    .toc a { padding: 7px 0; }
    footer { display: none; }   /* "scroll to zoom" is wrong advice on touch */
  }

  @media (prefers-reduced-motion: reduce) {
    #panel, #panel.open, #tree, #wrap.tree-open #tree, #tree-open, .toc-chev svg { transition: none; }
    /* still held back 150ms, but no fade and no pulse */
    #panel .page-loading { animation: page-loading-in 0s linear .15s both; }
    #panel .page-loading .sk { animation: none; }
  }

  /* A public page's text and links, rendered on the server (server/ssr.py), for
     readers and crawlers that run no JavaScript. The head's first script sets
     html.js before anything draws, so with JavaScript this never shows and the
     app shows the same page in its panel. Without it, the app (which cannot run)
     is hidden and the page scrolls like a document. */
  html.js #ssr { display: none; }
  html:not(.js), html:not(.js) body { height: auto; overflow: auto; }
  html:not(.js) #wrap { display: none; }
  #ssr { width: 100%; max-width: 760px; margin: 0 auto; padding: 28px 22px 72px;
         background: var(--bg); }
  #ssr h1 { font: 600 32px/1.2 var(--serif); margin: .3em 0 .6em; }
  #ssr .ssr-crumbs { margin: 0; font-size: 13px; color: var(--muted); }
  #ssr nav h2 { font-size: 20px; }
  #ssr nav li span { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="h-start">
    __BRAND__
    __PROJECT_PICKER__
  </div>
  <div id="find" role="search">
    <svg class="find-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"></circle><path d="M15 15l5 5"></path></svg>
    <input id="search" type="search" placeholder="Search pages and folders" autocomplete="off" spellcheck="false"
           aria-label="Search pages and folders" role="combobox" aria-autocomplete="list"
           aria-expanded="false" aria-controls="find-list">
    <kbd id="find-keys" aria-hidden="true">⌘F</kbd>
    <button id="find-clear" type="button" aria-label="Clear search" title="Clear (Esc)" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg>
    </button>
    <div id="find-list" role="listbox" aria-label="Matching pages" hidden></div>
  </div>
  <div class="h-end">
    __ACCOUNT__
  </div>
</header>
<div id="wrap">
  <nav id="tree" aria-label="Folders">
    <div class="tree-head"><span>Folders</span>
      <button id="tree-close" class="icon-btn" type="button" aria-controls="tree"
              aria-label="Hide folders" title="Hide folders">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 17l-5-5 5-5M18 17l-5-5 5-5"></path></svg>
      </button>
    </div>
    <div id="tree-list"></div>
    <div id="tree-grip" role="separator" aria-orientation="vertical" aria-controls="tree"
         aria-label="Resize folders" title="Drag to resize, double-click to reset"></div>
  </nav>
  <button id="tree-open" class="icon-btn" type="button" aria-controls="tree"
          aria-expanded="false" aria-label="Show folders" title="Show folders">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3.5" y="4.5" width="17" height="15" rx="2.2"></rect>
      <path d="M9.5 4.5v15"></path>
    </svg>
  </button>
  <div id="layout-pick">
    <button id="layout-button" type="button" aria-haspopup="menu" aria-expanded="false"
            aria-controls="layout-menu" title="How the pages are laid out">
      <span class="lo-cap">Layout</span><span class="lo-now">By folder</span>
      <svg class="sw-chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 6.2 8 3.2l3 3M5 9.8l3 3 3-3"></path></svg>
    </button>
    <div id="layout-menu" role="menu" aria-label="Layout" hidden></div>
  </div>
  <canvas id="graph"></canvas>
  <div id="panel-grip" role="separator" aria-orientation="vertical"
       aria-label="Resize page panel" title="Drag to resize, double-click to reset"></div>
  <div id="toc-grip" role="separator" aria-orientation="vertical"
       aria-label="Resize contents" title="Drag to resize, double-click to reset"></div>
  <aside id="panel" aria-live="polite"></aside>
  <footer>drag to move · scroll to zoom · click a page to open it</footer>
</div>
<script>__BOOTSTRAP__</script>
<script>__GRAPH_JS__</script>
<script>__INIT__</script>
</body>
</html>
