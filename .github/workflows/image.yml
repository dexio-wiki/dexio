# The public image, ghcr.io/dexio-wiki/dexio, for people who run their own copy
# (Dokploy's template, or DEXIO_IMAGE in deploy/.env). Built from deploy/Dockerfile's
# runtime stage for amd64 and arm64 on every push to main, after a smoke test of the
# amd64 build: the server starts with no mail, Stripe or AWS, answers /healthz, and
# takes a sign-up. The hosted service does not use this image; it has its own pipeline.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]              # a release tag vX.Y.Z also publishes X.Y.Z and X.Y
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          load: true
          tags: dexio:smoke

      - name: Smoke test
        run: |
          docker run -d --name dexio -p 8080:8080 \
            -e DEXIO_PUBLIC_URL=http://127.0.0.1:8080 -e DEXIO_FILES_DIR=/data/files dexio:smoke
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Origin: http://127.0.0.1:8080' \
            --data 'email=ci@example.com&password=a-long-ci-password-1&confirm_password=a-long-ci-password-1&first_name=CI&agree=1' \
            http://127.0.0.1:8080/signup)
          echo "sign-up answered $code"
          test "$code" = 303
          issuer=$(curl -fsS http://127.0.0.1:8080/.well-known/oauth-authorization-server | python3 -c "import sys,json;print(json.load(sys.stdin)['issuer'])")
          test "$issuer" = http://127.0.0.1:8080

      - name: Server log
        if: always()
        run: docker logs dexio 2>&1 | tail -40 || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dexio-wiki/dexio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Dexio
            org.opencontainers.image.description=Dexio: one wiki for all your agents. The server.
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
